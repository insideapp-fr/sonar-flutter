<p><code>Random()</code> from <code>dart:math</code> is a pseudo-random number generator and is not suitable for security-sensitive contexts.</p>
<h2>Recommended Secure Coding Practices</h2>
<ul><li>Use <code>Random.secure()</code> when generating tokens, salts, session identifiers or any value that must be unpredictable.</li></ul>
